name: Update database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  update-database:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: utils/database-conventer/package-lock.json
      - name: Install npm packages
        run: npm ci
        working-directory: ./utils/database-conventer
      - name: Download Installer
        run: node downloadDatabase.js
        working-directory: ./utils/database-conventer
      - name: Install database application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "./utils/database-conventer/temp/installer.exe" `
            -ArgumentList "-silent" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          $databasePath = "C:\Zip33U\DBF\rall1.dbf"
          if (-not (Test-Path $databasePath)) {
            throw "The installer completed but $databasePath was not found"
          }

          Copy-Item `
            -Path $databasePath `
            -Destination "./utils/database-conventer/src/rall1.dbf"
      - name: Convert database
        run: node index.js
        working-directory: ./utils/database-conventer
      - name: Copy result
        run: cp ./utils/database-conventer/result/zipcode.json ./src/assets/zipcode.json
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: GitHub Actions
          committer_email: github-actions[bot]@users.noreply.github.com
          message: "chore(data): update zipcode database"
          add: "src/assets/zipcode.json"
