name: Update database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: utils/database-conventer/package-lock.json
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar innoextract
      - name: Install npm packages
        run: npm ci
        working-directory: ./utils/database-conventer
      - name: Download Installer
        run: node downloadDatabase.js
        working-directory: ./utils/database-conventer
      - name: Extract database
        run: |
          innoextract ./temp/installer.exe
          cp ./app/DBF/rall1.dbf ./src/rall1.dbf
        working-directory: ./utils/database-conventer
      - name: Convert database
        run: node index.js
        working-directory: ./utils/database-conventer
      - name: Copy result
        run: cp ./utils/database-conventer/result/zipcode.json ./src/assets/zipcode.json
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: GitHub Actions
          committer_email: github-actions[bot]@users.noreply.github.com
          message: "chore(data): update zipcode database"
          add: "src/assets/zipcode.json"
