<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE8DE"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="0.55" stop-color="#F06E0A"/>
      <stop offset="1" stop-color="#D95300"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEEE2"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.38" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pinClip">
      <path transform="scale(5.12)" d="M77 43C77 60 62 76 53.6 85.2Q50 89 46.4 85.2C38 76 23 60 23 43A27 27 0 1 1 77 43Z"/>
    </clipPath>
    <!-- Pin: a soft shadow and a tight contact shadow on the tile. -->
    <filter id="pinFx" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b1"/>
      <feOffset in="b1" dy="3" result="o1"/>
      <feFlood flood-color="#7A2E00" flood-opacity="0.32"/>
      <feComposite in2="o1" operator="in" result="drop"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="b2"/>
      <feOffset in="b2" dy="0.8" result="o2"/>
      <feFlood flood-color="#5A2200" flood-opacity="0.3"/>
      <feComposite in2="o2" operator="in" result="contact"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="contact"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Bolt: raised off the pin. -->
    <filter id="boltFx" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b1"/>
      <feOffset in="b1" dy="1.4" result="o1"/>
      <feFlood flood-color="#7A2A00" flood-opacity="0.45"/>
      <feComposite in2="o1" operator="in" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <g transform="scale(5.12)">
    <path d="M77 43C77 60 62 76 53.6 85.2Q50 89 46.4 85.2C38 76 23 60 23 43A27 27 0 1 1 77 43Z" fill="url(#pin)" filter="url(#pinFx)"/>
  </g>
  <rect width="512" height="512" fill="url(#gloss)" clip-path="url(#pinClip)"/>
  <g transform="scale(5.12)">
    <path d="M52.29 26.46L39.26 45.19Q38 47 40.2 47L46.4 47Q48 47 47.71 48.57L45.55 60.05Q45 63 46.73 60.55L60.73 40.8Q62 39 59.8 39L53.6 39Q52 39 52.21 37.41L53.6 26.97Q54 24 52.29 26.46Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="2" stroke-linejoin="round" filter="url(#boltFx)"/>
  </g>
</svg>
