<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE9E5"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#F06A10"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#8A3300" flood-opacity="0.55"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="5"/>
      <feOffset dx="0" dy="7"/>
      <feComposite in2="SourceAlpha" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadow"/></feMerge>
    </filter>
  </defs>
  <!-- No tile: the pin stands on whatever is behind it. A faint outline keeps
       the white pin visible on white. -->
  <g transform="translate(256 262) scale(1.3) translate(-256 -262)">
    <path d="M256 432C256 432 122 334 122 224A134 134 0 1 1 390 224C390 334 256 432 256 432Z" fill="url(#pin)" stroke="#000000" stroke-opacity="0.1" stroke-width="2" filter="url(#lift)"/>
    <path transform="translate(0 22)" d="M278 140L210 230H252L236 300L304 202H262L286 140Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="10" stroke-linejoin="round" filter="url(#inset)"/>
  </g>
</svg>
